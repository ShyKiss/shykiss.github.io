name: Update ZZZ profile

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ZZZ profile
        run: node scripts/update-hoyolab.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/hoyolab.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ZZZ profile data"
            git push
          fi
